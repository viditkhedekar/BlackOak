name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blackoak
          POSTGRES_PASSWORD: blackoak
          POSTGRES_DB: blackoak
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U blackoak"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy
      # Migrations run BEFORE the tests, against the still-empty CI database. The
      # integration fixtures provision their schema with Base.metadata.create_all, which
      # builds every table but never stamps alembic_version — so with the tests first,
      # `alembic upgrade head` would start from base against an already-populated database
      # and die on 0001 with `relation "users" already exists`. Migrating first also makes
      # this step a genuine from-scratch check and lets the tests exercise the real
      # migrated schema (create_all then finds every table present and is a no-op).
      - name: Migrations apply cleanly
        run: uv run alembic upgrade head
      - name: No model changes missing a migration
        run: |
          uv run alembic check
      - name: Tests
        run: uv run pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
