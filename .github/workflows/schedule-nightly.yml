name: schedule / nightly

# Fundamentals slice + rescore — true target 02:00 ET, every day (no weekday gate;
# fundamentals don't respect weekends). See schedule-intraday-cycle.yml for why the cron
# below brackets a UTC window wider than the true target (DST).

on:
  schedule:
    - cron: '0 6-7 * * *'
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python -m app.cli schedule-job nightly
        env:
          ENVIRONMENT: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
